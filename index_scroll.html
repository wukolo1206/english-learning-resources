<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新北英語學扶數位資源庫</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
    /* ===================== TWEAK DEFAULTS ===================== */
    /* These values are live-editable via the Tweaks panel */
    </style>

    <script>
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "primaryColor": "#4361ee",
      "primaryDark": "#3251d4",
      "primaryLight": "#eef0ff",
      "accentColor": "#f59e0b",
      "bgMain": "#f6f7fb",
      "fontSizeBase": 16,
      "cardRadius": 10,
      "fontFamily": "Noto Sans TC"
    }/*EDITMODE-END*/;
    </script>

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap');

    :root {
        --primary:       #4361ee;
        --primary-dark:  #3251d4;
        --primary-light: #eef0ff;
        --accent:        #f59e0b;
        --text-main:     #1e2a3a;
        --text-muted:    #6b7a99;
        --text-light:    #9aaabe;
        --bg-main:       #f6f7fb;
        --bg-card:       #ffffff;
        --bg-sidebar:    #ffffff;
        --border-color:  #e4e8f0;
        --shadow-sm:     0 1px 4px 0 rgb(0 0 0 / 0.07);
        --shadow-md:     0 4px 16px -2px rgb(0 0 0 / 0.10);
        --shadow-lg:     0 8px 28px -4px rgb(0 0 0 / 0.12);
        --radius:        10px;
        --radius-sm:     7px;
        --radius-pill:   9999px;
        --font-size-base: 16px;
        --sidebar-width: 260px;
        --header-height: 68px;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        font-size: var(--font-size-base);
        line-height: 1.65;
        margin: 0; padding: 0;
        -webkit-font-smoothing: antialiased;
    }

    a {
        color: var(--primary-dark);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.15s;
    }
    a:hover { color: var(--primary); text-decoration: underline; }

    /* ===================== TOP HEADER ===================== */
    .top-header {
        position: fixed; top: 0; left: 0;
        width: 100%;
        background: rgba(255,255,255,0.93);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border-color);
        padding: 0 1.75rem;
        z-index: 50;
        box-shadow: var(--shadow-sm);
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
        height: var(--header-height);
    }
    .top-header .brand {
        display: flex; align-items: center; gap: 10px;
    }
    .top-header .brand-icon {
        width: 34px; height: 34px; border-radius: 9px;
        background: linear-gradient(135deg, var(--primary), #7c4dff);
        display: flex; align-items: center; justify-content: center;
        color: white; font-size: 1rem; flex-shrink: 0;
        box-shadow: 0 2px 8px rgba(67,97,238,0.35);
    }
    .top-header h1 {
        font-size: 1.35rem;
        margin: 0; font-weight: 900;
        background: linear-gradient(120deg, var(--primary), #7c4dff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.02em;
    }
    .top-header .right-group {
        display: flex; align-items: center; gap: 10px;
    }
    .editors-chip {
        color: var(--text-muted); font-size: 0.82rem; font-weight: 500;
        background: var(--bg-main); padding: 0.28rem 0.8rem;
        border-radius: var(--radius-pill); border: 1px solid var(--border-color);
        line-height: 1.5; white-space: nowrap;
    }

    /* ===================== LAYOUT ===================== */
    .layout {
        display: flex;
        height: calc(100vh - var(--header-height));
        overflow: hidden;
        margin-top: var(--header-height);
        background-color: var(--bg-main);
    }

    /* ===================== SIDEBAR ===================== */
    .sidebar {
        width: var(--sidebar-width);
        background: var(--bg-sidebar);
        border-right: 1px solid var(--border-color);
        display: flex; flex-direction: column;
        height: 100%; flex-shrink: 0;
        box-shadow: 1px 0 0 var(--border-color);
    }
    .sidebar-nav { overflow-y: auto; padding: 0.75rem 0 1.5rem; flex-grow: 1; }

    .nav-grade {
        padding: 0.7rem 1.2rem 0.25rem;
        font-weight: 800; color: var(--text-main);
        font-size: 0.78rem; letter-spacing: 0.07em;
        text-transform: uppercase; margin-top: 0.6rem;
        display: flex; align-items: center; gap: 6px;
    }
    .nav-grade-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), #7c4dff);
        display: inline-block;
    }
    .nav-link {
        display: flex; align-items: center; gap: 0.45rem;
        padding: 0.5rem 1.2rem 0.5rem 2.1rem;
        color: var(--text-muted); font-size: 0.92rem; font-weight: 500;
        transition: all 0.15s ease;
        border-left: 3px solid transparent;
        line-height: 1.4; text-decoration: none; cursor: pointer;
    }
    .nav-link:hover {
        background: var(--primary-light); color: var(--primary-dark);
        text-decoration: none; border-left-color: var(--primary);
    }
    .nav-link.active {
        background: var(--primary-light); color: var(--primary-dark);
        border-left-color: var(--primary); font-weight: 700;
    }

    /* ===================== MAIN CONTENT ===================== */
    .main-content {
        flex-grow: 1; overflow-y: auto;
        padding: 1.75rem 2.25rem;
        background: var(--bg-main); scroll-behavior: smooth;
    }
    .content-container { max-width: 840px; margin: 0 auto; }

    /* ---- Hint bar ---- */
    .hint-bar {
        background: var(--primary-light); color: var(--primary-dark);
        padding: 0.6rem 1rem; border-radius: var(--radius-sm);
        margin-bottom: 1.5rem; font-size: 0.875rem;
        display: flex; align-items: center; gap: 0.6rem;
        border: 1px solid rgba(67,97,238,0.15);
    }

    /* ---- Grade section ---- */
    .grade-section { margin-bottom: 2.75rem; }
    .grade-title {
        font-size: 1.45rem; font-weight: 900;
        padding-bottom: 0.65rem; margin-bottom: 1.1rem;
        color: var(--text-main); border-bottom: 2px solid var(--border-color);
        position: relative; margin-top: 0;
        display: flex; align-items: center; gap: 10px;
    }
    .grade-title::after {
        content: '';
        position: absolute; bottom: -2px; left: 0;
        width: 48px; height: 3px;
        background: linear-gradient(90deg, var(--primary), #7c4dff);
        border-radius: 2px;
    }
    .grade-count {
        font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
        background: var(--bg-main); border: 1px solid var(--border-color);
        border-radius: var(--radius-pill); padding: 0.15rem 0.6rem;
        margin-left: auto;
    }

    /* ---- Domain accordion ---- */
    .domain-section {
        margin-bottom: 0.65rem;
        background: var(--bg-card);
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        transition: box-shadow 0.2s;
    }
    .domain-section:hover { box-shadow: var(--shadow-md); }
    .domain-title {
        font-size: 1.05rem; font-weight: 700; margin: 0;
        padding: 0.9rem 1.25rem;
        display: flex; align-items: center; gap: 0.65rem;
        color: var(--text-main); cursor: pointer;
        transition: background 0.15s;
        list-style: none; user-select: none;
    }
    .domain-title::-webkit-details-marker { display: none; }
    .domain-title:hover { background: var(--bg-main); }
    .domain-section[open] > .domain-title {
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-main);
    }
    .domain-icon {
        width: 28px; height: 28px; border-radius: 7px;
        background: var(--primary-light); color: var(--primary);
        display: flex; align-items: center; justify-content: center;
        font-size: 0.8rem; flex-shrink: 0;
    }
    .domain-body { padding: 1rem 1.25rem; }
    .domain-chevron {
        margin-left: auto; color: var(--text-light); font-size: 0.8rem;
        transition: transform 0.2s;
    }
    .domain-section[open] .domain-chevron { transform: rotate(180deg); }

    /* ---- Type section ---- */
    .type-section {
        margin-bottom: 0.5rem;
        border-left: 3px solid var(--primary-light);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        background: #f9faff; overflow: hidden;
    }
    .type-title {
        font-size: 0.9rem; font-weight: 700; color: var(--text-muted);
        padding: 0.55rem 1rem; margin: 0; cursor: pointer;
        list-style: none; display: flex; align-items: center; gap: 0.4rem;
        transition: background 0.15s, color 0.15s;
        user-select: none;
    }
    .type-title::-webkit-details-marker { display: none; }
    .type-title:hover { background: var(--primary-light); color: var(--primary-dark); }
    .type-section[open] > .type-title {
        background: var(--primary-light); color: var(--primary-dark);
        border-bottom: 1px solid rgba(67,97,238,0.18);
    }
    .type-body { padding: 0.6rem 0.75rem; }

    /* ---- Unit section ---- */
    .unit-section { margin-bottom: 0.4rem; }
    .unit-title {
        font-size: 0.88rem; color: var(--text-main); font-weight: 600;
        margin-bottom: 0; background: transparent;
        padding: 0.42rem 0.75rem; border-radius: var(--radius-sm);
        display: flex; align-items: center; gap: 0.4rem;
        cursor: pointer; list-style: none; transition: background 0.15s;
        user-select: none;
    }
    .unit-title::-webkit-details-marker { display: none; }
    .unit-title:hover { background: rgba(67,97,238,0.07); }
    .unit-body { padding-left: 1.25rem; padding-top: 0.3rem; }

    /* ---- Resource Card ---- */
    .resource-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-left: 3px solid transparent;
        border-radius: var(--radius-sm);
        padding: 0.65rem 1rem;
        margin-top: 0.35rem; margin-bottom: 0.35rem;
        box-shadow: var(--shadow-sm);
        transition: all 0.18s ease;
        position: relative;
    }
    .resource-card:hover {
        border-left-color: var(--primary);
        box-shadow: var(--shadow-md);
        transform: translateX(3px);
        background: #fdfeff;
    }
    .resource-card.no-link {
        background: #fafafa;
        border-left-color: #d1d9e6;
        opacity: 0.8;
    }
    .resource-card.no-link:hover { transform: none; box-shadow: var(--shadow-sm); }
    .resource-title {
        font-weight: 600; font-size: 0.92rem; margin-bottom: 0.28rem;
        display: flex; align-items: center; flex-wrap: wrap;
        color: var(--text-main);
    }
    .resource-title.muted { color: var(--text-muted); }
    .resource-link {
        font-size: 0.82rem; color: var(--primary-dark); font-weight: 500;
        display: inline-flex; align-items: center; gap: 3px;
    }
    .resource-link:hover { color: var(--primary); }

    /* ---- Badges ---- */
    .badge {
        display: inline-flex; align-items: center;
        padding: 0.18rem 0.6rem; border-radius: var(--radius-pill);
        font-size: 0.77rem; font-weight: 700;
        letter-spacing: 0.02em; margin-right: 0.5rem;
        white-space: nowrap;
    }
    .badge-video  { background: #fff0f0; color: #c0392b; }
    .badge-game   { background: #f0fff4; color: #1e7e46; }
    .badge-slides { background: #fff8ee; color: #b45309; }
    .badge-ebook  { background: #f0f4ff; color: #3251d4; }
    .badge-doc    { background: #f5f0ff; color: #6d28d9; }
    .badge-other  { background: var(--primary-light); color: var(--primary-dark); }
    .badge-notype { background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; }

    .hint-label {
        display: inline-block; font-size: 0.72rem; color: #94a3b8;
        background: #f1f5f9; border: 1px solid #e2e8f0;
        border-radius: var(--radius-pill); padding: 0.1rem 0.55rem; margin-top: 0.25rem;
    }

    /* ===================== HAMBURGER & OVERLAY ===================== */
    .hamburger-btn {
        display: none; background: none; border: 1px solid var(--border-color);
        cursor: pointer; padding: 0.38rem 0.5rem; border-radius: var(--radius-sm);
        color: var(--text-main); flex-direction: column; gap: 5px;
        align-items: center; justify-content: center; flex-shrink: 0;
    }
    .hamburger-btn span { display: block; width: 20px; height: 2px; background: currentColor; border-radius: 2px; }
    .sidebar-overlay {
        display: none; position: fixed; inset: 0; top: var(--header-height);
        background: rgba(30,42,58,0.4); z-index: 39;
    }
    .sidebar-overlay.open { display: block; }

    /* ===================== BELL BUTTON ===================== */
    .bell-btn {
        background: white; border: 1px solid var(--border-color); font-size: 1rem;
        cursor: pointer; color: var(--text-main); position: relative;
        padding: 0.38rem 0.55rem; border-radius: 50%; transition: all 0.2s;
        display: flex; align-items: center; justify-content: center;
        box-shadow: var(--shadow-sm);
    }
    .bell-btn:hover { transform: scale(1.08); background: var(--primary-light); }
    .bell-badge {
        position: absolute; top: -2px; right: -2px; width: 11px; height: 11px;
        background: #ef4444; border-radius: 50%; display: none; border: 2px solid white;
    }
    .bell-badge.active { display: block; animation: pulse 2s infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(239,68,68,0.7)} 70%{box-shadow:0 0 0 6px rgba(239,68,68,0)} 100%{box-shadow:0 0 0 0 rgba(239,68,68,0)} }

    /* ===================== LOADING / ERROR ===================== */
    #loading-container {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; padding: 5rem 2rem; gap: 1rem; color: var(--text-muted);
    }
    .spinner {
        width: 2.5rem; height: 2.5rem;
        border: 3px solid var(--primary-light); border-top-color: var(--primary);
        border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error-container {
        background: #fff0f0; border: 1px solid #fecaca; color: #b91c1c;
        border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-bottom: 1rem;
    }

    /* ===================== BACK TO TOP ===================== */
    #back-to-top {
        position: fixed; bottom: 1.5rem; right: 1.5rem;
        width: 2.6rem; height: 2.6rem; border-radius: 50%;
        background: var(--primary); color: white; border: none;
        cursor: pointer; font-size: 1.1rem;
        box-shadow: 0 4px 14px rgba(67,97,238,0.45);
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none;
        transition: opacity 0.25s, transform 0.25s;
        z-index: 100;
    }
    #back-to-top.visible { opacity: 1; pointer-events: auto; }
    #back-to-top:hover { transform: translateY(-3px); }

    /* ===================== NOTIFICATION MODAL ===================== */
    .modal-overlay {
        position: fixed; inset: 0; background: rgba(30,42,58,0.5); z-index: 9999;
        display: none; align-items: center; justify-content: center;
        backdrop-filter: blur(3px);
    }
    .modal-overlay.open { display: flex; }
    .changelog-modal {
        background: white; width: 90%; max-width: 540px; max-height: 80vh;
        border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
        box-shadow: var(--shadow-lg);
    }
    .modal-header {
        padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border-color);
        display: flex; justify-content: space-between; align-items: center;
        background: linear-gradient(120deg, var(--primary-light), #f5f0ff);
    }
    .modal-header h2 { margin: 0; font-size: 1.05rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
    .close-btn { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: var(--text-muted); line-height: 1; border-radius: 6px; padding: 0 4px; transition: color 0.15s; }
    .close-btn:hover { color: #ef4444; }
    .modal-body { padding: 1.4rem 1.5rem; overflow-y: auto; }
    .log-item { margin-bottom: 1.2rem; padding-bottom: 1.2rem; border-bottom: 1px dashed var(--border-color); }
    .log-item:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
    .log-meta { display: flex; gap: 7px; margin-bottom: 7px; align-items: center; font-size: 0.82rem; flex-wrap: wrap; }
    .log-date { color: var(--text-muted); font-weight: 600; background: var(--bg-main); padding: 2px 7px; border-radius: 5px; }
    .log-content { color: var(--text-main); line-height: 1.65; font-size: 0.9rem; }
    .lbl-new { background: #dcfce7; color: #166534; padding: 2px 7px; border-radius: 5px; font-weight: 700; white-space: nowrap; font-size: 0.78rem; }
    .lbl-fix { background: #fef9c3; color: #854d0e; padding: 2px 7px; border-radius: 5px; font-weight: 700; white-space: nowrap; font-size: 0.78rem; }
    .lbl-ann { background: var(--primary-light); color: var(--primary-dark); padding: 2px 7px; border-radius: 5px; font-weight: 700; white-space: nowrap; font-size: 0.78rem; }

    /* ===================== RESPONSIVE ===================== */
    @media (max-width: 1024px) and (min-width: 768px) {
        :root { --sidebar-width: 210px; }
        .main-content { padding: 1.25rem 1.5rem; }
    }
    @media (max-width: 767px) {
        .top-header { padding: 0 0.85rem; gap: 0.5rem; }
        .top-header h1 { font-size: 1rem; }
        .editors-chip { display: none; }
        .hamburger-btn { display: flex; }
        .sidebar {
            position: fixed; left: -270px; top: var(--header-height);
            width: var(--sidebar-width); height: calc(100vh - var(--header-height));
            z-index: 40; transition: left 0.25s ease;
            box-shadow: 4px 0 20px rgba(0,0,0,0.12);
        }
        .sidebar.open { left: 0; }
        .main-content { padding: 1rem; }
        .content-container { max-width: 100%; }
    }

    /* ===================== TWEAKS PANEL ===================== */
    #tweaks-panel {
        position: fixed; bottom: 4.5rem; right: 1.5rem; z-index: 200;
        background: white; border: 1px solid var(--border-color);
        border-radius: 14px; box-shadow: var(--shadow-lg);
        padding: 1.1rem 1.25rem; width: 240px;
        display: none; flex-direction: column; gap: 12px;
    }
    #tweaks-panel.open { display: flex; }
    .tweak-title { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .tweak-row { display: flex; flex-direction: column; gap: 4px; }
    .tweak-row label { font-size: 0.8rem; font-weight: 600; color: var(--text-main); }
    .tweak-row input[type="color"] { width: 100%; height: 32px; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; padding: 2px 4px; }
    .tweak-row input[type="range"] { width: 100%; accent-color: var(--primary); }
    .tweak-row select { width: 100%; padding: 5px 8px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.82rem; font-family: inherit; color: var(--text-main); background: white; }
    .tweak-row .range-val { font-size: 0.78rem; color: var(--text-muted); text-align: right; }
    </style>
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header class="top-header">
    <div style="display:flex;align-items:center;gap:8px;">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="開啟目錄">
            <span></span><span></span><span></span>
        </button>
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-book-open"></i></div>
            <h1>新北英語學扶數位資源庫</h1>
        </div>
    </div>
    <div class="right-group">
        <a id="reportLink" href="#" target="_top" class="editors-chip" style="text-decoration:none;color:var(--primary,#4361ee);font-weight:600">📊 報表建議</a>
        <div class="editors-chip">碧華國小吳國榮 ・ 更寮國小王筱瑛 ・ 竹田國小劉蘋老師</div>
        <button class="bell-btn" id="bellBtn" title="最新消息">
            <i class="fas fa-bell"></i>
            <span class="bell-badge" id="bellBadge"></span>
        </button>
    </div>
</header>

<button id="back-to-top" title="回到頂部"><i class="fas fa-arrow-up"></i></button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ==================== LAYOUT ==================== -->
<div class="layout">
    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav" id="sidebar-nav"><!-- 動態產生 --></nav>
    </aside>

    <main class="main-content" id="mainScroll">
        <div id="loading-container">
            <div class="spinner"></div>
            <div>正在連線至資料庫...</div>
        </div>
        <div id="error-container" style="display:none;"></div>
        <div class="content-container" id="main-content" style="display:none;"></div>
    </main>
</div>

<!-- ==================== CHANGELOG MODAL ==================== -->
<div class="modal-overlay" id="changelogModal">
    <div class="changelog-modal">
        <div class="modal-header">
            <h2><i class="fas fa-bell" style="color:var(--primary)"></i> 最新資源上線與系統公告</h2>
            <button class="close-btn" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body" id="changelogBody">
            <div style="text-align:center;color:var(--text-muted);padding:2rem 0;">目前尚無最新消息</div>
        </div>
    </div>
</div>

<!-- ==================== TWEAKS PANEL ==================== -->
<div id="tweaks-panel">
    <div class="tweak-title">Tweaks</div>
    <div class="tweak-row">
        <label>主要顏色</label>
        <input type="color" id="tw-primary" value="#4361ee">
    </div>
    <div class="tweak-row">
        <label>字體大小 <span class="range-val" id="tw-font-val">16px</span></label>
        <input type="range" id="tw-fontsize" min="14" max="20" step="1" value="16">
    </div>
    <div class="tweak-row">
        <label>卡片圓角 <span class="range-val" id="tw-radius-val">10px</span></label>
        <input type="range" id="tw-radius" min="4" max="18" step="2" value="10">
    </div>
    <div class="tweak-row">
        <label>字型</label>
        <select id="tw-font">
            <option value="'Noto Sans TC', sans-serif">Noto Sans TC</option>
            <option value="'Microsoft JhengHei', sans-serif">微軟正黑體</option>
            <option value="Georgia, serif">Georgia</option>
        </select>
    </div>
</div>

<script>
// ===================== APPLY TWEAKS FROM DEFAULTS =====================
(function() {
    const d = TWEAK_DEFAULTS;
    applyColor(d.primaryColor);
    applyFontSize(d.fontSizeBase);
    applyRadius(d.cardRadius);
    document.getElementById('tw-primary').value = d.primaryColor;
    document.getElementById('tw-fontsize').value = d.fontSizeBase;
    document.getElementById('tw-font-val').textContent = d.fontSizeBase + 'px';
    document.getElementById('tw-radius').value = d.cardRadius;
    document.getElementById('tw-radius-val').textContent = d.cardRadius + 'px';
})();

function hexToHSL(hex) {
    let r = parseInt(hex.slice(1,3),16)/255,
        g = parseInt(hex.slice(3,5),16)/255,
        b = parseInt(hex.slice(5,7),16)/255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    let h,s,l=(max+min)/2;
    if(max===min){h=s=0;}else{
        const d=max-min; s=l>0.5?d/(2-max-min):d/(max+min);
        switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}
        h/=6;
    }
    return [Math.round(h*360),Math.round(s*100),Math.round(l*100)];
}

function applyColor(hex) {
    const [h,s,l] = hexToHSL(hex);
    const r = document.documentElement;
    r.style.setProperty('--primary', hex);
    r.style.setProperty('--primary-dark', 'hsl(' + h + ',' + s + '%,' + Math.max(l-10,20) + '%)');
    r.style.setProperty('--primary-light', 'hsl(' + h + ',' + Math.min(s+10,100) + '%,' + Math.min(l+30,96) + '%)');
}
function applyFontSize(px) {
    document.documentElement.style.setProperty('--font-size-base', px+'px');
}
function applyRadius(px) {
    document.documentElement.style.setProperty('--radius', px+'px');
    document.documentElement.style.setProperty('--radius-sm', Math.max(px-3,4)+'px');
}

// Tweak listeners
document.getElementById('tw-primary').addEventListener('input', function() {
    applyColor(this.value);
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{primaryColor:this.value}},'*');
});
document.getElementById('tw-fontsize').addEventListener('input', function() {
    applyFontSize(this.value);
    document.getElementById('tw-font-val').textContent = this.value+'px';
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{fontSizeBase:+this.value}},'*');
});
document.getElementById('tw-radius').addEventListener('input', function() {
    applyRadius(this.value);
    document.getElementById('tw-radius-val').textContent = this.value+'px';
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{cardRadius:+this.value}},'*');
});
document.getElementById('tw-font').addEventListener('change', function() {
    document.body.style.fontFamily = this.value;
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{fontFamily:this.value}},'*');
});

// Tweaks toggle
window.addEventListener('message', function(e) {
    if (e.data && e.data.type === '__activate_edit_mode')   document.getElementById('tweaks-panel').classList.add('open');
    if (e.data && e.data.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('open');
});
window.parent.postMessage({type:'__edit_mode_available'},'*');

// ===================== FORMAT → BADGE =====================
function getBadgeHtml(format, url) {
    if (!url && (!format || !format.trim())) return '<span class="badge badge-notype">📌 提示</span>';
    const f = (format || '').trim();
    if (f.includes('影片'))               return '<span class="badge badge-video"><i class="fas fa-play-circle"></i> 影片</span>';
    if (f.includes('遊戲')||f.includes('測驗')) return '<span class="badge badge-game"><i class="fas fa-gamepad"></i> 遊戲/測驗</span>';
    if (f.includes('簡報'))               return '<span class="badge badge-slides"><i class="fas fa-chalkboard"></i> 簡報</span>';
    if (f.includes('電子書'))             return '<span class="badge badge-ebook"><i class="fas fa-book"></i> 電子書</span>';
    if (f.includes('文件'))               return '<span class="badge badge-doc"><i class="fas fa-file-alt"></i> 文件</span>';
    if (!url) return '<span class="badge badge-notype">📌 提示</span>';
    return '<span class="badge badge-other"><i class="fas fa-link"></i> ' + (f||'其他') + '</span>';
}

// ===================== BUILD PAGE =====================
function buildPage(payload) {
    var data = (payload && payload.resources) ? payload.resources : payload;
    var logs = (payload && payload.logs) ? payload.logs : [];

    // Filter header row
    data = data.filter(function(r){ return r[0] && r[0] !== '年級'; });

    // Changelog
    var changelogBody = document.getElementById('changelogBody');
    var bellBadge = document.getElementById('bellBadge');
    var CHANGELOG_KEY = 'changelog_last_read';
    var latestLogDate = (logs && logs.length > 0) ? logs[0].date : '';

    if (logs && logs.length > 0) {
        var lastRead = localStorage.getItem(CHANGELOG_KEY) || '';
        if (latestLogDate > lastRead) bellBadge.classList.add('active');
        changelogBody.innerHTML = logs.map(function(log) {
            var cls = 'lbl-ann';
            if (log.type && log.type.indexOf('新增') !== -1) cls = 'lbl-new';
            else if (log.type && log.type.indexOf('修正') !== -1) cls = 'lbl-fix';
            var rel = (log.grade || log.domain)
                ? '<span class="badge badge-other" style="margin-right:0;">' + (log.grade||'') + ' ' + (log.domain||'') + '</span>' : '';
            return '<div class="log-item"><div class="log-meta"><span class="log-date">' + log.date + '</span><span class="' + cls + '">' + log.type + '</span>' + rel + '</div><div class="log-content">' + log.content + '</div></div>';
        }).join('');
    }

    // Bell modal
    document.getElementById('bellBtn').addEventListener('click', function() {
        document.getElementById('changelogModal').classList.add('open');
        bellBadge.classList.remove('active');
        if (latestLogDate) localStorage.setItem(CHANGELOG_KEY, latestLogDate);
    });
    document.getElementById('closeModalBtn').addEventListener('click', function() {
        document.getElementById('changelogModal').classList.remove('open');
    });
    document.getElementById('changelogModal').addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('open');
    });

    // Group data: grade → domain → type → unit → resources
    var gradeMap = {};
    data.forEach(function(row) {
        var grade=row[0]||'', domain=row[1]||'', type=row[2]||'', unit=row[3]||'', name=row[4]||'', format=row[5]||'', url=row[6]||'';
        if (!grade) return;
        if (!gradeMap[grade]) gradeMap[grade] = {};
        if (!gradeMap[grade][domain]) gradeMap[grade][domain] = {};
        if (!gradeMap[grade][domain][type]) gradeMap[grade][domain][type] = {};
        if (!gradeMap[grade][domain][type][unit]) gradeMap[grade][domain][type][unit] = [];
        gradeMap[grade][domain][type][unit].push({ name, format, url });
    });

    // Domain icons
    var domainIcons = {
        '字母': 'fa-font', '字詞與文法句構': 'fa-spell-check', '常用語': 'fa-comments',
        '整合資源': 'fa-layer-group', '語音': 'fa-microphone', '考古題': 'fa-file-alt', '重點整理': 'fa-list-check',
    };
    function getDomainIcon(domain) {
        for (var k in domainIcons) { if (domain.includes(k)) return domainIcons[k]; }
        return 'fa-folder-open';
    }

    // Build sidebar
    var sidebarNav = document.getElementById('sidebar-nav');
    var sidebarHtml = '';
    Object.keys(gradeMap).forEach(function(grade) {
        var gradeId = 'grade-' + grade.replace(/\s/g,'_');
        sidebarHtml += '<div class="nav-grade"><span class="nav-grade-dot"></span>' + grade + '</div>';
        Object.keys(gradeMap[grade]).forEach(function(domain) {
            sidebarHtml += '<a class="nav-link" data-target="' + gradeId + '" data-domain="' + domain + '" href="#' + gradeId + '">' + domain + '</a>';
        });
    });
    sidebarNav.innerHTML = sidebarHtml;

    // Build main content
    var mainEl = document.getElementById('main-content');
    var mainHtml = '<div class="hint-bar"><i class="fas fa-info-circle"></i> 請使用左側目錄瀏覽各年級資源，或直接捲動頁面查看完整列表。</div>';

    Object.keys(gradeMap).forEach(function(grade) {
        var gradeId = 'grade-' + grade.replace(/\s/g,'_');
        var totalResources = 0;
        // count resources
        Object.values(gradeMap[grade]).forEach(function(domains) {
            Object.values(domains).forEach(function(types) {
                Object.values(types).forEach(function(units) {
                    totalResources += units.length;
                });
            });
        });

        mainHtml += '<div class="grade-section" id="' + gradeId + '">';
        mainHtml += '<h2 class="grade-title">' + grade;
        mainHtml += '<span class="grade-count">' + totalResources + ' 項資源</span></h2>';

        Object.keys(gradeMap[grade]).forEach(function(domain) {
            var iconCls = getDomainIcon(domain);
            mainHtml += '<details class="domain-section">';
            mainHtml += '<summary class="domain-title"><div class="domain-icon"><i class="fas ' + iconCls + '"></i></div>' + domain + '<span class="domain-chevron"><i class="fas fa-chevron-down"></i></span></summary>';
            mainHtml += '<div class="domain-body">';

            Object.keys(gradeMap[grade][domain]).forEach(function(type) {
                mainHtml += '<details class="type-section">';
                mainHtml += '<summary class="type-title"><i class="fas fa-angle-right" style="font-size:0.75rem"></i>' + type + '</summary>';
                mainHtml += '<div class="type-body">';

                Object.keys(gradeMap[grade][domain][type]).forEach(function(unit) {
                    var resources = gradeMap[grade][domain][type][unit];
                    var skipUnit = (unit === type);
                    if (!skipUnit) {
                        mainHtml += '<details class="unit-section">';
                        mainHtml += '<summary class="unit-title"><i class="fas fa-angle-right" style="font-size:0.72rem;color:#9aaabe"></i>' + unit + '</summary>';
                        mainHtml += '<div class="unit-body">';
                    }
                    resources.forEach(function(r) {
                        var noLink = !r.url;
                        mainHtml += '<div class="resource-card' + (noLink ? ' no-link' : '') + '">';
                        mainHtml += '<div class="resource-title' + (noLink ? ' muted' : '') + '">' + getBadgeHtml(r.format, r.url) + r.name + '</div>';
                        if (r.url) mainHtml += '<a class="resource-link" href="' + r.url + '" target="_blank"><i class="fas fa-external-link-alt"></i> 開啟資源</a>';
                        if (noLink) mainHtml += '<span class="hint-label">📌 純文字提示，無連結</span>';
                        mainHtml += '</div>';
                    });
                    if (!skipUnit) mainHtml += '</div></details>';
                });

                mainHtml += '</div></details>';
            });

            mainHtml += '</div></details>';
        });

        mainHtml += '</div>';
    });

    mainEl.innerHTML = mainHtml;
    document.getElementById('loading-container').style.display = 'none';
    mainEl.style.display = 'block';

    // ---- Sidebar nav click ----
    sidebarNav.querySelectorAll('.nav-link').forEach(function(link) {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            var targetId = this.getAttribute('data-target');
            var targetEl = document.getElementById(targetId);
            if (targetEl) {
                var mainScroll = document.getElementById('mainScroll');
                mainScroll.scrollTop = targetEl.offsetTop - 16;
                // Close mobile sidebar
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('open');
            }
            sidebarNav.querySelectorAll('.nav-link').forEach(function(l){ l.classList.remove('active'); });
            this.classList.add('active');
        });
    });

    // ---- Intersection Observer (sidebar active highlight) ----
    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                var id = entry.target.id;
                sidebarNav.querySelectorAll('.nav-link').forEach(function(l){ l.classList.remove('active'); });
                var matching = sidebarNav.querySelector('[data-target="' + id + '"]');
                if (matching) matching.classList.add('active');
            }
        });
    }, { root: document.getElementById('mainScroll'), threshold: 0.15 });

    document.querySelectorAll('.grade-section').forEach(function(el){ observer.observe(el); });

    // ---- Back to top ----
    var mainScroll = document.getElementById('mainScroll');
    var backBtn = document.getElementById('back-to-top');
    mainScroll.addEventListener('scroll', function() {
        backBtn.classList.toggle('visible', mainScroll.scrollTop > 300);
    });
    backBtn.addEventListener('click', function() { mainScroll.scrollTop = 0; });
}

// ---- Hamburger ----
document.getElementById('hamburgerBtn').addEventListener('click', function() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('open');
});
document.getElementById('sidebarOverlay').addEventListener('click', function() {
    document.getElementById('sidebar').classList.remove('open');
    this.classList.remove('open');
});

// ---- Error handler ----
function showError(err) {
    document.getElementById('loading-container').style.display = 'none';
    var errDiv = document.getElementById('error-container');
    errDiv.innerHTML = '<strong>⚠️ 讀取失敗：</strong>' + err.message + '<br><small>請確認工作表名稱為 English。</small>';
    errDiv.style.display = 'block';
}

// ---- Data fetch (Apps Script or sample fallback) ----
window.onload = function() {
    if (typeof google !== 'undefined' && google.script) {
        google.script.run
            .withSuccessHandler(buildPage)
            .withFailureHandler(showError)

        // Preview fallback — sample data
        setTimeout(function() {
            buildPage({
                resources: [
                    ['三年級','字母','影片','ABC 字母認識','Super Simple Songs - ABC Song','影片','https://www.youtube.com'],
                    ['三年級','字母','影片','ABC 字母認識','Phonics: Short Vowel Songs','影片','https://www.youtube.com'],
                    ['三年級','字母','遊戲/測驗','字母排序','Starfall ABC 互動遊戲','遊戲','https://www.starfall.com'],
                    ['三年級','字詞與文法句構','電子書','基礎單字','三年級課本單字電子書（上冊）','電子書','https://example.com'],
                    ['三年級','字詞與文法句構','電子書','基礎單字','三年級課本單字電子書（下冊）','電子書','https://example.com'],
                    ['三年級','字詞與文法句構','遊戲/測驗','字彙遊戲','Quizlet - 三年級單字卡','遊戲','https://quizlet.com'],
                    ['三年級','字詞與文法句構','遊戲/測驗','字彙遊戲','本單元目前尚無進階數位資源','',''],
                    ['三年級','常用語','影片','日常問候','Hello Song - Greetings for Kids','影片','https://www.youtube.com'],
                    ['四年級','語音(字母拼讀規則)','影片','CVC 拼讀','Phonics - Short Vowels CVC Words','影片','https://www.youtube.com'],
                    ['四年級','語音(字母拼讀規則)','影片','CVC 拼讀','Jolly Phonics Actions Song','影片','https://www.youtube.com'],
                    ['四年級','語音(字母拼讀規則)','電子書','Sight Words','Fry Words 第一組練習卡','電子書','https://example.com'],
                    ['四年級','語音(字母拼讀規則)','遊戲/測驗','拼讀練習','Phonics Hero 線上練習','遊戲','https://example.com'],
                    ['四年級','整合資源','簡報','四年級統整','四年級上學期複習簡報','簡報','https://example.com'],
                    ['五年級','字詞與文法句構','文件','時態練習','現在式 vs 現在進行式練習卷','文件','https://example.com'],
                    ['五年級','字詞與文法句構','文件','時態練習','過去式句型整理','文件','https://example.com'],
                    ['五年級','語音-音韻覺識','影片','音韻覺識基礎','Phonemic Awareness Activities','影片','https://www.youtube.com'],
                    ['六年級','整合資源','簡報','六年級統整','六年級畢業總複習簡報','簡報','https://example.com'],
                    ['六年級','常用語','影片','情境對話','Real English - Everyday Dialogues','影片','https://www.youtube.com'],
                    ['歷屆考古題及重點整理','考古題','考古題','考古題','112 學年度英語學力檢測考古題','文件','https://example.com'],
                    ['歷屆考古題及重點整理','考古題','考古題','考古題','111 學年度英語學力檢測考古題','文件','https://example.com'],
                    ['歷屆考古題及重點整理','重點整理','重點整理','重點整理','國小六年英語重點整理（字彙版）','文件','https://example.com'],
                ],
                logs: [
                    { date:'2026-04-08', type:'🔄內容修正', grade:'全年級', domain:'', content:'修正側邊欄與主內容頂部出現多餘年級/領域節的問題。' },
                    { date:'2026-03-20', type:'🆕新增資源', grade:'五年級', domain:'整合資源', content:'新增五、六年級整合資源共 12 筆，含互動遊戲與電子書。' },
                    { date:'2026-03-13', type:'📢系統公告', grade:'', domain:'', content:'側邊欄新增 Intersection Observer 滾動高亮功能，並加入回到頂部按鈕。' },
                ]
            });
        }, 600);
    }
};
</script>

    if (typeof google !== 'undefined' && google.script) {
        google.script.run.withSuccessHandler(function(info) {
            if (!info) return;
            document.getElementById('appVer').textContent = info.version;
            document.getElementById('appUpd').textContent = info.updated;
            var rl = document.getElementById('reportLink');
            if (rl && info.url) { rl.href = info.url + '?page=report'; }
        }).getAppInfo();
    }
});
</script>
