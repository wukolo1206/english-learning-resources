<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f0f2f5; font-family: "Microsoft JhengHei", sans-serif; }
    
    /* 頂部標題區 */
    .hero-section {
      background: linear-gradient(120deg, #2980b9, #6dd5fa);
      color: white;
      padding: 40px 20px;
      margin-bottom: 30px;
      text-align: center;
      border-radius: 0 0 15px 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    /* 左側篩選卡片 */
    .filter-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      position: sticky;
      top: 20px;
    }

    /* 資源卡片樣式 */
    .resource-card {
      border: none;
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
      background: white;
      height: 100%;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .resource-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
    }
    .card-body {
      flex: 1;
      padding: 1.25rem;
    }
    
    /* 標籤樣式 */
    .badge-grade { background-color: #e3f2fd; color: #1976d2; border: 1px solid #bbdefb; }
    .badge-cat { background-color: #f3e5f5; color: #7b1fa2; border: 1px solid #e1bee7; }

    /* 資源類型顏色條 (左側邊框) */
    .border-game { border-left: 5px solid #4caf50; } /* 綠色-遊戲 */
    .border-video { border-left: 5px solid #f44336; } /* 紅色-影片 */
    .border-doc { border-left: 5px solid #2196f3; }   /* 藍色-文件 */
    .border-other { border-left: 5px solid #ff9800; } /* 橘色-其他 */

    #loading-msg { font-size: 1.2rem; color: #555; margin-top: 20px; }

    /* ===================== NOTIFICATION MODAL ===================== */
    .bell-btn {
        position: absolute; right: 20px; top: 20px;
        background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.4); 
        color: white; font-size: 1.25rem; cursor: pointer;
        padding: 0.5rem; border-radius: 50%; transition: all 0.2s;
        display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;
    }
    .bell-btn:hover { background: rgba(255,255,255,0.4); transform: scale(1.05); }
    .bell-badge {
        position: absolute; top: 0px; right: 0px; width: 12px; height: 12px;
        background: #ef4444; border-radius: 50%; display: none; border: 2px solid #2980b9;
    }
    .bell-badge.active { display: block; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 70% { box-shadow: 0 0 0 6px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
    
    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999;
        display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px);
    }
    .modal-overlay.open { display: flex; }
    .changelog-modal {
        background: white; width: 90%; max-width: 550px; max-height: 80vh;
        border-radius: 12px; display: flex; flex-direction: column; overflow: hidden;
        box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); text-align: left; color: #333;
    }
    .modal-header-custom {
        padding: 1.25rem 1.5rem; border-bottom: 1px solid #e2e8f0;
        display: flex; justify-content: space-between; align-items: center; background: #f8fafc;
    }
    .modal-header-custom h2 { margin: 0; font-size: 1.25rem; font-weight: bold; color: #1e293b; display: flex; align-items: center; gap: 8px;}
    .close-btn { background: none; border: none; font-size: 1.75rem; cursor: pointer; color: #64748b; line-height: 1; }
    .close-btn:hover { color: #ef4444; }
    .modal-body-custom { padding: 1.5rem; overflow-y: auto; }
    .log-item { margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px dashed #e2e8f0; }
    .log-item:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
    .log-meta { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; font-size: 0.85rem; flex-wrap: wrap; }
    .log-date { color: #64748b; font-weight: 600; background: #f1f5f9; padding: 2px 6px; border-radius: 4px;}
    .log-content { color: #1e293b; line-height: 1.6; }
    
    .lbl-new { background: #dcfce7; color: #166534; padding: 2px 6px; border-radius: 4px; font-weight: 700; white-space: nowrap;}
    .lbl-fix { background: #fef08a; color: #854d0e; padding: 2px 6px; border-radius: 4px; font-weight: 700; white-space: nowrap;}
    .lbl-ann { background: #e0e7ff; color: #3730a3; padding: 2px 6px; border-radius: 4px; font-weight: 700; white-space: nowrap;}
  </style>
</head>
<body>

<div class="hero-section position-relative">
  <button class="bell-btn" id="bellBtn" title="最新消息">
      <i class="fas fa-bell"></i><span class="bell-badge" id="bellBadge"></span>
  </button>
  <h1><i class="fas fa-search me-2"></i>新北英語學扶數位資源庫</h1>
  <p class="mb-0">編輯團隊：新北市碧華國小吳國榮、新北市更寮國小王筱瑛、屏東縣竹田國小劉蘋老師</p>
  <p class="mb-0 mt-2"><a href="?page=report" style="color:#fff;text-decoration:underline">📊 上傳學扶測驗報表，產生教學建議與課程計畫</a></p>
</div>

<div class="container-fluid px-4">
  <div class="row">
    
    <div class="col-lg-3 mb-4">
      <div class="filter-card">
        <h5 class="mb-3 border-bottom pb-2"><i class="fas fa-filter me-2"></i>篩選條件</h5>
        
        <div class="mb-3">
          <label class="form-label fw-bold">年級 (Grade)</label>
          <select id="gradeSelect" class="form-select">
            <option value="">全部年級</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">領域/類別</label>
          <select id="categorySelect" class="form-select" disabled>
            <option value="">請先選擇年級</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">單元/子分類</label>
          <select id="unitSelect" class="form-select" disabled>
            <option value="">請先選擇領域</option>
          </select>
        </div>
        
        <hr>

        <div class="mb-3">
          <label class="form-label fw-bold">資源形式</label>
          <select id="typeSelect" class="form-select">
            <option value="">全部形式</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">關鍵字搜尋</label>
          <input type="text" id="searchInput" class="form-control" placeholder="輸入單元或資源名稱...">
        </div>
        
        <button onclick="resetFilters()" class="btn btn-outline-secondary w-100">
          <i class="fas fa-undo me-1"></i> 重置所有條件
        </button>
      </div>
    </div>

    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 id="resultCount" class="fw-bold text-secondary">資料載入中...</h5>
      </div>

      <div id="loading-container" class="text-center py-5">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
        <div id="loading-msg">正在連線至資料庫...</div>
      </div>

      <div id="error-container" class="alert alert-danger d-none text-center"></div>

      <div class="row g-3" id="cardsContainer"></div>
    </div>
  </div>
</div>

<!-- 更新紀錄 Modal -->
<div class="modal-overlay" id="changelogModal">
    <div class="changelog-modal">
        <div class="modal-header-custom">
            <h2><i class="fas fa-bell text-warning"></i> 最新資源上線與公告</h2>
            <button class="close-btn" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body-custom" id="changelogBody">
            <div class="text-center text-muted py-4">目前尚無最新消息</div>
        </div>
    </div>
</div>

<script>
  let allData = [];

  // 當網頁載入完成
  window.onload = function() {
    // 呼叫後端函式，並設定成功與失敗的處理器
    google.script.run
      .withSuccessHandler(initPage)
      .withFailureHandler(showError)
      .getDataFromSheet();
  };

  // ❌ 錯誤處理
  function showError(error) {
    document.getElementById('loading-container').style.display = 'none';
    const errDiv = document.getElementById('error-container');
    errDiv.innerHTML = `<h4>⚠️ 讀取失敗</h4><p>${error.message}</p><p>請檢查後端程式碼中的「工作表名稱」是否正確。</p>`;
    errDiv.classList.remove('d-none');
  }

  // ✅ 成功讀取資料
  function initPage(payload) {
    allData = payload.resources || [];
    var logs = payload.logs || [];
    
    document.getElementById('loading-container').style.display = 'none';

    // --- 渲染 Modal ---
    var changelogBody = document.getElementById('changelogBody');
    var bellBadge = document.getElementById('bellBadge');
    
    var CHANGELOG_KEY = 'changelog_last_read';
    var latestLogDate = (logs && logs.length > 0) ? logs[0].date : '';

    if (logs && logs.length > 0) {
        var lastRead = localStorage.getItem(CHANGELOG_KEY) || '';
        if (latestLogDate > lastRead) {
            bellBadge.classList.add('active'); // 有新通知才亮紅點
        }
        var logHtml = logs.map(function(log) {
            var lblClass = 'lbl-ann';
            if (log.type && log.type.indexOf('新增') !== -1) lblClass = 'lbl-new';
            else if (log.type && log.type.indexOf('修正') !== -1) lblClass = 'lbl-fix';
            
            var relationTag = (log.grade || log.domain) ? "<span class='badge bg-light text-dark border' style='margin:0; font-size:0.75rem; font-weight:normal;'>" + (log.grade || '') + " " + (log.domain || '') + "</span>" : "";

            return "<div class='log-item'>" +
                   "<div class='log-meta'><span class='log-date'>" + log.date + "</span><span class='" + lblClass + "'>" + log.type + "</span> " + relationTag + "</div>" +
                   "<div class='log-content'>" + log.content + "</div>" +
                   "</div>";
        }).join('');
        changelogBody.innerHTML = logHtml;
    }

    // Modal 開關邏輯
    var bellBtn = document.getElementById('bellBtn');
    var changelogModal = document.getElementById('changelogModal');
    var closeBtn = document.getElementById('closeModalBtn');
    if (bellBtn) {
        bellBtn.addEventListener('click', function() {
            changelogModal.classList.add('open');
            bellBadge.classList.remove('active');
            if (latestLogDate) localStorage.setItem(CHANGELOG_KEY, latestLogDate); // 記住已讀到哪一筆
        });
        closeBtn.addEventListener('click', function() {
            changelogModal.classList.remove('open');
        });
        changelogModal.addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('open');
        });
    }

    if (allData.length === 0) {
      document.getElementById('resultCount').innerText = "資料庫是空的";
      return;
    }

    // 初始化下拉選單 (第0欄=年級, 第5欄=資源形式)
    populateDropdown('gradeSelect', 0);
    populateDropdown('typeSelect', 5);
    
    // 顯示所有資料
    renderCards(allData);
    updateCount(allData.length);
  }

  // 產生下拉選單選項
  function populateDropdown(elementId, colIndex, parentFilter = null) {
    const select = document.getElementById(elementId);
    select.length = 1; // 保留第一個預設選項

    // 篩選出不重複的選項
    const uniqueItems = [...new Set(allData.filter(row => {
      if (!parentFilter) return true;
      return row[parentFilter.col] === parentFilter.val;
    }).map(row => row[colIndex]))].filter(val => val);

    uniqueItems.sort().forEach(item => {
      const option = document.createElement('option');
      option.value = item;
      option.text = item;
      select.add(option);
    });
  }

  // === 連動選單邏輯 ===
  
  // 1. 選了年級 -> 開放領域
  document.getElementById('gradeSelect').addEventListener('change', function() {
    const grade = this.value;
    const catSelect = document.getElementById('categorySelect');
    const unitSelect = document.getElementById('unitSelect');
    
    catSelect.innerHTML = '<option value="">全部領域</option>';
    catSelect.disabled = !grade;
    unitSelect.innerHTML = '<option value="">請先選擇領域</option>';
    unitSelect.disabled = true;

    if (grade) {
      populateDropdown('categorySelect', 1, {col: 0, val: grade});
    }
    applyFilters();
  });

  // 2. 選了領域 -> 開放單元
  document.getElementById('categorySelect').addEventListener('change', function() {
    const grade = document.getElementById('gradeSelect').value;
    const category = this.value;
    const unitSelect = document.getElementById('unitSelect');
    
    unitSelect.innerHTML = '<option value="">全部單元</option>';
    unitSelect.disabled = !category;

    if (category) {
      // 這裡要做雙重過濾 (年級+領域) 才能找出正確的單元
      const validUnits = [...new Set(allData.filter(row => 
        row[0] === grade && row[1] === category
      ).map(row => row[3]))].filter(val => val); // 第3欄是單元

      validUnits.sort().forEach(u => {
        const opt = document.createElement('option');
        opt.value = u;
        opt.text = u;
        unitSelect.add(opt);
      });
    }
    applyFilters();
  });

  // 其他篩選器監聽
  document.getElementById('unitSelect').addEventListener('change', applyFilters);
  document.getElementById('typeSelect').addEventListener('change', applyFilters);
  document.getElementById('searchInput').addEventListener('input', applyFilters);

  // === 核心篩選功能 ===
  function applyFilters() {
    const grade = document.getElementById('gradeSelect').value;
    const category = document.getElementById('categorySelect').value;
    const unit = document.getElementById('unitSelect').value;
    const type = document.getElementById('typeSelect').value;
    const keyword = document.getElementById('searchInput').value.toLowerCase();

    const filtered = allData.filter(row => {
      // 欄位對照: [0]年級, [1]領域, [3]單元, [4]名稱, [5]形式
      return (grade === "" || row[0] === grade) &&
             (category === "" || row[1] === category) &&
             (unit === "" || row[3] === unit) &&
             (type === "" || row[5] === type) &&
             (keyword === "" || row[4].toLowerCase().includes(keyword) || row[3].toLowerCase().includes(keyword));
    });

    renderCards(filtered);
    updateCount(filtered.length);
  }

  // === 渲染卡片 ===
  function renderCards(data) {
    const container = document.getElementById('cardsContainer');
    container.innerHTML = "";

    if (data.length === 0) {
      container.innerHTML = '<div class="col-12 text-center text-muted py-5">找不到符合的資源</div>';
      return;
    }

    data.forEach(row => {
      const [grade, category, itemType, unit, name, format, url] = row;
      
      // 判斷樣式
      let borderClass = "border-other";
      let icon = "fa-file";
      let btnClass = "btn-outline-secondary";
      
      if (format && format.includes("遊戲")) { 
        borderClass = "border-game"; icon = "fa-gamepad"; btnClass = "btn-success"; 
      } else if (format && format.includes("影片")) { 
        borderClass = "border-video"; icon = "fa-youtube"; btnClass = "btn-danger"; 
      } else if (format && format.includes("簡報")) { 
        borderClass = "border-doc"; icon = "fa-chalkboard-user"; btnClass = "btn-primary"; 
      }

      // 判斷按鈕狀態
      const btnHtml = url 
        ? `<a href="${url}" target="_blank" class="btn ${btnClass} w-100"><i class="fas fa-external-link-alt me-1"></i> 開啟資源</a>`
        : `<button class="btn btn-secondary w-100" disabled>純文字提示</button>`;

      const html = `
        <div class="col-md-6 col-lg-4">
          <div class="resource-card ${borderClass}">
            <div class="card-body">
              <div class="mb-2">
                <span class="badge badge-grade me-1">${grade}</span>
                <span class="badge badge-cat">${category}</span>
              </div>
              <small class="text-muted d-block mb-1">${unit}</small>
              <h5 class="card-title fw-bold mb-3">${name}</h5>
              <div class="text-secondary small mb-3">
                <i class="fas ${icon} me-1"></i> ${format || "其他"}
              </div>
              <div class="mt-auto">
                ${btnHtml}
              </div>
            </div>
          </div>
        </div>
      `;
      container.innerHTML += html;
    });
  }

  function resetFilters() {
    document.getElementById('gradeSelect').value = "";
    document.getElementById('categorySelect').innerHTML = '<option value="">請先選擇年級</option>';
    document.getElementById('categorySelect').disabled = true;
    document.getElementById('unitSelect').innerHTML = '<option value="">請先選擇領域</option>';
    document.getElementById('unitSelect').disabled = true;
    document.getElementById('typeSelect').value = "";
    document.getElementById('searchInput').value = "";
    applyFilters();
  }

  function updateCount(count) {
    document.getElementById('resultCount').innerText = `搜尋結果：${count} 筆`;
  }
</script>

<footer id="appFooter" style="text-align:center;padding:14px 12px 20px;font-size:0.78rem;color:#64748b;line-height:1.7;">新北英語學扶數位資源庫　·　版本 <span id="appVer">—</span>　·　更新時間 <span id="appUpd">—</span></footer>
<script>
// 頁尾版本資訊（版本來源：Code.js 的 APP_VERSION / APP_UPDATED）
document.addEventListener('DOMContentLoaded', function() {
    if (typeof google !== 'undefined' && google.script) {
        google.script.run.withSuccessHandler(function(info) {
            if (!info) return;
            document.getElementById('appVer').textContent = info.version;
            document.getElementById('appUpd').textContent = info.updated;
        }).getAppInfo();
    }
});
</script>
</body>
</html>
