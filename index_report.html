<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>學扶報表 → 教學資源建議</title>
<style>
:root{
  --primary:#4361ee; --primary-dark:#3251d4; --bg:#f6f7fb; --card:#fff;
  --text:#1e293b; --muted:#64748b; --border:#e2e8f0; --warn:#b45309; --warn-bg:#fffbeb;
  --err:#b91c1c; --err-bg:#fef2f2; --ok:#047857;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7}
header{background:var(--primary);color:#fff;padding:18px 20px}
header h1{margin:0;font-size:1.15rem}
header p{margin:4px 0 0;font-size:.82rem;opacity:.9}
header a{color:#fff}
main{max-width:1060px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:1rem}
.btn{background:var(--primary);color:#fff;border:0;border-radius:8px;padding:9px 16px;
  font-size:.9rem;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--primary-dark)}
.btn.sec{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.muted{color:var(--muted);font-size:.84rem}
.privacy{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;
  border-radius:8px;padding:10px 12px;font-size:.84rem;margin-top:10px}
.box-warn{background:var(--warn-bg);border:1px solid #fde68a;color:var(--warn);
  border-radius:8px;padding:10px 12px;font-size:.85rem;margin:10px 0}
.box-err{background:var(--err-bg);border:1px solid #fecaca;color:var(--err);
  border-radius:8px;padding:10px 12px;font-size:.85rem;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f1f5f9}
details.ind{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;background:#fff}
details.ind>summary{cursor:pointer;padding:12px 14px;list-style:none}
details.ind>summary::-webkit-details-marker{display:none}
details.ind[open]>summary{border-bottom:1px solid var(--border)}
.sum-line{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.plain{font-size:1rem;font-weight:600}
.score{font-size:.85rem;color:var(--muted);white-space:nowrap}
.bar{height:6px;background:#eef2f7;border-radius:99px;margin:8px 0 6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.flags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flag{font-size:.74rem;border-radius:999px;padding:1px 8px;background:#f1f5f9;color:var(--muted);border:1px solid var(--border)}
.flag.warn{background:var(--warn-bg);color:var(--warn);border-color:#fde68a}
.code{font-size:.72rem;color:#94a3b8;margin-left:auto}
.ind-body{padding:12px 14px 16px}
.qs{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:.86rem}
.q{margin-top:4px}
.unit{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden}
.unit-head{background:#f8fafc;border-bottom:1px solid var(--border);padding:7px 11px;
  font-size:.9rem;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kind{font-size:.72rem;font-weight:500;background:#fef3c7;color:#92400e;
  border:1px solid #fde68a;border-radius:999px;padding:1px 8px}
.unit-cols{display:flex;gap:16px;flex-wrap:wrap;padding:10px 12px}
.rcol{flex:1;min-width:240px}
.rlabel{font-size:.82rem;font-weight:700;color:var(--primary-dark);margin-bottom:5px}
.ritem{margin:3px 0;font-size:.9rem}
.ritem a{color:var(--primary-dark)}
.linkbtn{background:none;border:0;color:var(--primary);cursor:pointer;font-size:.82rem;padding:2px 0;font-family:inherit}
.hint{margin-top:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;font-size:.84rem;color:var(--warn)}
.tag{font-size:.76rem;color:var(--muted)}
.desig{background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;border-radius:4px;font-size:.72rem;padding:0 5px;margin-right:4px}
.top3{margin:6px 0 10px;padding-left:22px}
.top3 li{margin-bottom:8px}
.ok{color:var(--ok)}
.planbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}
.planbar input[type=number]{padding:5px 6px;border:1px solid var(--border);border-radius:6px;font-family:inherit}
table.plan td{font-size:.85rem}
table.plan td>div{margin:2px 0}
.use{display:inline-block;background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;
  border-radius:4px;font-size:.72rem;padding:0 5px;margin-right:4px}
details.maint>summary{cursor:pointer;font-size:.9rem}
.maint-body{margin-top:10px;font-size:.84rem}
.maint-body h3{font-size:.86rem;margin:14px 0 4px}
#loading{display:none;color:var(--muted);font-size:.9rem}
footer{text-align:center;padding:14px 12px 24px;font-size:.78rem;color:var(--muted)}
@media print{
  header,.noprint{display:none}
  body{background:#fff}
  details.ind[open]{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <h1>學扶報表 → 教學資源建議</h1>
  <p>上傳「特定學生測驗報告」，依評量重點找出對應的基本學習內容細項與教學資源　·
     <a href="?page=scroll">回資源查詢</a></p>
</header>

<main>
  <div class="card noprint">
    <h2>1. 選擇報表檔案</h2>
    <input type="file" id="file" accept=".xlsx,.csv">
    <button class="btn" id="run">產生建議</button>
    <button class="btn sec" id="check">檢查設定</button>
    <span id="loading">處理中…</span>
    <div class="privacy">
      <strong>學生姓名不會離開這台電腦。</strong>
      檔案在你的瀏覽器裡解析，姓名就地換成「學生1、學生2…」後才送出計算；
      對照表只存在這個分頁，關掉就消失。伺服器不會儲存任何資料。
    </div>
    <div id="msg"></div>
  </div>

  <div id="result"></div>
</main>

<footer>
  新北英語學扶數位資源庫　·　版本 <span id="appVer">—</span>　·　更新時間 <span id="appUpd">—</span>
</footer>

<?!= include('report_js'); ?>
</body>
</html>
